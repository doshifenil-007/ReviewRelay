services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to your own secured MongoDB database}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to your own secured Redis service}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a unique random JWT access secret of at least 32 characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a different random JWT refresh secret of at least 32 characters}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set your GitHub OAuth app client ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set your GitHub OAuth app client secret}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:?Set your public HTTPS OAuth callback URL}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:?Set a unique random encryption key of at least 32 characters}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set a unique random webhook secret of at least 32 characters}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set this to your public HTTPS application origin}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
